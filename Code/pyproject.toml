[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triwave-gnn"
version = "0.3.0"
description = "Pin-level circuit representation learning with structural, functional and transient behavior embeddings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["triwave_gnn*"]

[tool.setuptools.package-data]
"triwave_gnn.pretrained" = ["*.pth", "README.md"]
